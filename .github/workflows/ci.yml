name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun build.ts --out dist
      - run: sh tree-sitter/build.sh && git diff --exit-code tree-sitter
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - run: sh regex/build.sh && git diff --exit-code regex

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: HELIX_DIR="$RUNNER_TEMP/helix" sh test/oracle/setup.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ${{ runner.temp }}/helix
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: test/oracle/cache-*.json
          key: oracle-${{ hashFiles('test/oracle/setup.sh', 'test/oracle/suites.ts', 'test/oracle/fuzz.ts') }}
          restore-keys: oracle-
      - run: HELIX_DIR="$RUNNER_TEMP/helix" bun test
